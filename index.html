<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Viewer</title>
<style>
  :root{--bg:#101418;--panel:#161c22;--panel2:#1e262e;--border:#2b3540;--text:#e7edf3;--muted:#93a1ad;--accent:#3fa9f5;--accent2:#2b6cff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{position:relative;height:100vh;width:100vw;}
  #canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;}

  #panel{position:absolute;top:16px;left:16px;z-index:20;width:300px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;}
  .head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .head .badge{width:38px;height:38px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b1a4a;border:none;}
  .head .badge img{width:100%;height:100%;object-fit:cover;display:block;}
  .head h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  .head .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .actions{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
  .btn{flex:1;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:6px 8px;border-radius:8px;font-size:12px;line-height:1.2;cursor:pointer;transition:background .15s,border-color .15s;user-select:none;height:48px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;overflow:hidden;}
  .btn:hover{background:#26303a;border-color:#3a4b5c;}
  .btn.primary{border-color:var(--accent2);}
  .btn:disabled,.btn.disabled{opacity:.4;cursor:not-allowed;background:#1a2027;border-color:var(--border);color:var(--muted);}
  .btn:disabled:hover,.btn.disabled:hover{background:#1a2027;border-color:var(--border);}
  .actions-row{display:flex;gap:8px;}
  .actions-row+.actions-row{margin-top:8px;}

  /* ---------- Сворачиваемый список деталей ---------- */
  .list-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 13px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px;transition:background .12s;}
  .list-toggle:hover{background:var(--panel2);}
  .list-toggle .chevron{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:10px;line-height:1;transition:transform .18s,background .12s;}
  .list-toggle:hover .chevron{background:#26303a;border-color:var(--accent);}
  #list.collapsed{display:none;}

  /* ---------- Undo / Redo ---------- */
  .hist-btn{display:flex;align-items:center;justify-content:center;}
  .hist-btn .hist-label{display:block;line-height:1.2;overflow:hidden;}
  .hist-btn .arrow{font-size:15px;line-height:1;}
  .hist-btn .kbd{font-size:10px;color:var(--muted);opacity:.7;margin-left:2px;}
  #btn-undo{border-color:#3a4b5c;}
  .hotkey-note{font-size:10px;color:var(--muted);opacity:.6;text-align:center;margin-top:5px;}

  .list{overflow-y:auto;flex:1;padding:6px;scrollbar-width:thin;scrollbar-color:#3a4b5c transparent;}
  .list::-webkit-scrollbar{width:9px;}
  .list::-webkit-scrollbar-thumb{background:#3a4b5c;border-radius:8px;border:2px solid var(--panel);}

  .item{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:3px 0;border-radius:8px;cursor:pointer;user-select:none;border:1px solid transparent;transition:background .12s,border-color .12s;}
  .item:hover{background:var(--panel2);border-color:var(--border);}
  .item .check{width:18px;height:18px;border-radius:5px;border:2px solid #5a6a78;flex:none;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
  .item.on .check{background:var(--accent);border-color:var(--accent);}
  .item .check::after{content:"";width:10px;height:10px;border-radius:2px;background:#fff;transform:scale(0);transition:transform .12s;}
  .item.on .check::after{transform:scale(1);}
  .item .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .item .name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item.off .name{color:var(--muted);text-decoration:line-through;}

  /* ---------- Дерево групп ---------- */
  .group{margin-bottom:4px;}
  .group-head{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:3px 0;border-radius:8px;cursor:pointer;user-select:none;background:var(--panel2);border:1px solid var(--border);transition:background .12s,border-color .12s;}
  .group-head:hover{background:#26303a;border-color:#3a4b5c;}
  .group-head .g-chev{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;color:var(--accent);transition:transform .15s;transform:rotate(0deg);}
  .group-head .g-chev svg{display:block;width:16px;height:16px;}
  .group.collapsed .group-head .g-chev{transform:rotate(-90deg);}
  .group-head .g-name{flex:1;font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .group-head .g-count{flex:none;font-size:11px;color:var(--muted);background:rgba(0,0,0,.25);border-radius:10px;padding:1px 7px;}
  .g-hide{flex:none;width:26px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;color:var(--accent);background:var(--panel);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:background .12s,border-color .12s,color .12s;user-select:none;}
  .g-hide:hover{background:#0d1117;border-color:var(--accent);}
  .g-hide.off{color:var(--muted);border-color:var(--border);background:var(--panel2);}
  .g-hide.off:hover{color:var(--text);border-color:var(--muted);}
  .group-body{padding-left:8px;border-left:1px solid var(--border);margin-left:9px;}
  .group.collapsed .group-body{display:none;}

  .empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;}
  .foot{padding:10px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6;}

  #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(16,20,24,.7);border:1px solid var(--border);border-radius:30px;padding:8px 16px;font-size:12px;color:var(--muted);white-space:nowrap;backdrop-filter:blur(4px);transition:opacity .4s;pointer-events:none;}
  #hint b{color:var(--text);font-weight:600;}

  .view-cube{position:absolute;right:28px;bottom:70px;width:96px;height:96px;z-index:25;perspective:700px;user-select:none;}
  .cube{position:relative;width:96px;height:96px;transform-style:preserve-3d;}
  .face{position:absolute;left:0;top:0;width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#dfe7ee;background:rgba(30,38,46,.92);border:1px solid #3a4b5c;cursor:pointer;backface-visibility:hidden;transition:background .12s;}
  .face:hover{background:rgba(63,169,245,.35);}
  .face.front{transform:translateZ(48px);}
  .face.back{transform:rotateY(180deg) translateZ(48px);}
  .face.right{transform:rotateY(90deg) translateZ(48px);}
  .face.left{transform:rotateY(-90deg) translateZ(48px);}
  .face.top{transform:rotateX(90deg) translateZ(48px);}
  .face.bottom{transform:rotateX(-90deg) translateZ(48px);}

  /* ---------- Рулетка (замер расстояния) — ОТКЛЮЧЕНО, вернуть позже ----------
  #measure-btn{position:absolute;top:16px;right:16px;z-index:30;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:background .15s,border-color .15s,color .15s;box-shadow:0 6px 16px rgba(0,0,0,.3);}
  #measure-btn:hover{background:#26303a;border-color:#3a4b5c;color:var(--text);}
  #measure-btn.on{color:#0b1a4a;background:var(--accent);border-color:var(--accent);}
  #measure-btn svg{width:22px;height:22px;display:block;}
  #measure-label{position:absolute;z-index:30;transform:translate(-50%,-100%);padding:4px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--accent);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(0,0,0,.35);}
  ---------- */

  #overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);gap:16px;transition:opacity .5s;}
  #overlay.gone{opacity:0;pointer-events:none;}
  .spinner{width:46px;height:46px;border-radius:50%;border:4px solid #22303a;border-top-color:var(--accent);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #overlay .msg{font-size:14px;}
  #overlay .err{color:#e5484d;max-width:440px;text-align:center;line-height:1.5;display:none;}

  /* ---------- Освещение: настройки ---------- */
  .light-section{padding:10px 14px;border-top:1px solid var(--border);}
  .light-section h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px;}
  .ctl{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px;color:var(--muted);}
  .ctl label{flex:1;}
  .ctl input[type=range]{flex:2;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:var(--panel2);outline:none;cursor:pointer;}
  .ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #0b0e11;}
  .ctl input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:2px solid #0b0e11;}
  .ctl .val{width:34px;text-align:right;color:var(--text);}
  .ao-block{margin-top:4px;padding-top:8px;border-top:1px dashed var(--border);}
  .ao-toggle label{flex:none;cursor:pointer;color:var(--text);font-weight:500;}
  .ao-toggle input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}
  .online{color:var(--muted);font-size:11px;line-height:1.4;}

  @media (max-width:560px){#panel{width:min(280px,calc(100vw - 32px));}}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/",
    "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.35.0/build/index.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <!-- [РУЛЕТКА ОТКЛЮЧЕНА] Кнопка и подпись замера скрыты, код в JS закомментирован.
  <button id="measure-btn" title="Рулетка — замерить расстояние (клик по двум точкам, Esc — отмена)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="9" width="20" height="6" rx="1"/>
      <path d="M6 9v3M9 9v3M12 9v3M15 9v3M18 9v3"/>
      <path d="M2 11h1M21 11h1"/>
    </svg>
  </button>
  <div id="measure-label"></div>
  -->

  <div id="panel">
    <div class="head">
      <div class="badge"><img src="./channels4_profile.jpg" alt="Почта России"></div>
      <div>
        <h1>МОПС</h1>
      </div>
    </div>
    <div class="actions">
      <div class="actions-row">
        <button class="btn" id="btn-all">Показать всё</button>
        <button class="btn" id="btn-none">Скрыть всё</button>
        <button class="btn hist-btn" id="btn-undo" title="Вернуть деталь (Ctrl+Z)" disabled>
          <span class="hist-label"><span class="arrow">↶</span> Вернуть деталь</span>
        </button>
      </div>
    </div>
    <div class="list-toggle" id="list-toggle"><span>Список деталей</span><span class="chevron" id="list-chevron">▲</span></div>
    <div class="list" id="list"><div class="empty">Загрузка модели…</div></div>

    <div class="foot"><span id="visible-count">0 / 0</span> видимо · <span id="hidden-count">0</span> скрыто</div>
  </div>

  <div id="hint"><b>ЛКМ</b> — вращать · <b>Колесо</b> — масштаб · <b>ПКМ</b> — панорама<br><b>Двойной клик по детали</b> — скрыть</div>

  <div class="view-cube">
    <div class="cube" id="cube">
      <div class="face front"  data-dir="0,0,1">Перед</div>
      <div class="face back"   data-dir="0,0,-1">Зад</div>
      <div class="face left"   data-dir="-1,0,0">Лево</div>
      <div class="face right"  data-dir="1,0,0">Право</div>
      <div class="face top"    data-dir="0,1,0">Верх</div>
      <div class="face bottom" data-dir="0,-1,0">Низ</div>
    </div>
  </div>

  <div id="overlay">
    <div class="spinner"></div>
    <div class="msg" id="load-msg">Загружаем модель…</div>
    <div class="err" id="load-err"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { N8AOPass } from 'https://cdn.jsdelivr.net/npm/n8ao@2.0.1/dist/N8AO.js';

const canvas  = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const loadMsg = document.getElementById('load-msg');
const loadErr = document.getElementById('load-err');

/* ---------- Рендер ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));   // производительность
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------- Сцена ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);   // белый фон

// IBL-окружение: даёт металлу/глянцу равномерные отражения со всех сторон,
// чтобы не было «чёрной стороны» у блестящих материалов.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.5;   // мягкое окружение, без яркого «солнечного» блика
pmrem.dispose();

/* Нейтральное стандартное освещение (фиксированное, без регуляторов):
   мягкий купол + базовая заливка + направленные источники для тени.
   Несколько направленных «прожекторов» вокруг модели дают контактную
   тень от КАЖДОЙ детали на соседние (объектное затенение в стыках). */
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8a929b, 1.0);
scene.add(hemiLight);

const ambient = new THREE.AmbientLight(0xffffff, 0.32);
scene.add(ambient);

// Направленные источники для контактного затенения между 48 деталями.
// Настраиваются (позиция/границы тени) в fitCamera под размер модели.
const shadowRig = [];
function addShadowLight(dirVec, intensity){
  const l = new THREE.DirectionalLight(0xffffff, intensity);
  l.castShadow = true;
  l.userData.baseDir = dirVec.clone().normalize(); // исходное (неповёрнутое) направление
  l.userData.dir = l.userData.baseDir.clone();
  scene.add(l);
  scene.add(l.target);
  shadowRig.push(l);
  return l;
}
addShadowLight(new THREE.Vector3(0.75, 0.4, 0.6), 0.55);  // свет сбоку-спереди
addShadowLight(new THREE.Vector3(-0.9, 0.5, 0.3), 0.55);  // слева
addShadowLight(new THREE.Vector3(0.3, 0.5, -0.9), 0.55);  // сзади-справа

/* ---------- Камера ---------- */
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;

/* ---------- Постобработка: N8AO (SSAO) ----------
   N8AOPass сам рендерит сцену и накладывает AO (заменяет RenderPass). Это
   высококачественный SSAO с «мировым» радиусом (aoRadius в юнитах = мм модели),
   поэтому затенение стабильно на любой дистанции и читается на тонких деталях.
   SMAA после — т.к. аппаратный MSAA не дружит с AO. */
const composer = new EffectComposer(renderer);
const n8ao = new N8AOPass(scene, camera, window.innerWidth, window.innerHeight);
window.__n8ao = n8ao;

// N8AO сам делает гамма-коррекцию (outputColorSpace), поэтому финального
// OutputPass не нужно. Параметры берем из панели (см. applyAO ниже).
n8ao.configuration.aoRadius = 300;            // Расстояние, мм (мировые юниты) — «Детали»
n8ao.configuration.distanceFalloff = 1.0;
n8ao.configuration.aoSamples = 24;            // Точность — «Детали»
n8ao.configuration.denoiseSamples = 8;
n8ao.configuration.denoiseRadius = 12;
n8ao.configuration.denoiseIterations = 2;
n8ao.configuration.intensity = 5.0;          // Фактор (контраст затемнения) — «Детали»
n8ao.configuration.screenSpaceRadius = false; // мировой радиус
n8ao.configuration.gammaCorrection = true;
n8ao.configuration.renderMode = 0;            // 0 = Combined (красота + AO)
// Производительность: считаем AO в половинном разрешении и апскейлим с учётом
// глубины — почти незаметно на глаз, но заметно быстрее на слабых GPU.
n8ao.configuration.halfRes = false;
n8ao.configuration.depthAwareUpsampling = true;
composer.addPass(n8ao);
composer.addPass(new SMAAPass(window.innerWidth, window.innerHeight));

let needsRender = true; // отложенный рендер: пересчитываем кадр только при реальном изменении

/* ---------- Состояние ---------- */
const parts = [];
const listEl = document.getElementById('list');
const palette = [0x4aa8ff,0xff7a6b,0x5ad38f,0xffc04d,0xb98bff,0x51d1d6,0xff8fd1,0xa7c957];

let modelCenter = new THREE.Vector3();
let modelMaxDim = 1;
let cameraDist  = 1;
let modelRoot   = null;   // корень модели (для габаритов без учёта пола)
let groundPlane = null;   // пол с контактной тенью
let modelBox    = null;   // габариты модели для AO-клипа (scene clip box)

function updateCount(){
  const v = parts.filter(p => p.object.visible).length;
  document.getElementById('visible-count').textContent = `${v} / ${parts.length}`;
  document.getElementById('hidden-count').textContent = String(parts.length - v);
}

function chooseName(n, i){
  if (n && n.trim()) return n.trim();
  return `Деталь ${i + 1}`;
}

function buildList(){
  listEl.innerHTML = '';
  if (parts.length === 0){ listEl.innerHTML = '<div class="empty">Не найдено ни одной отдельной детали.</div>'; return; }

  // Группируем детали, сохраняя порядок GROUPS (остальные — в конец).
  const byGroup = new Map();
  parts.forEach(p => {
    if (!byGroup.has(p.group)) byGroup.set(p.group, []);
    byGroup.get(p.group).push(p);
  });

  const ordered = [];
  GROUPS.forEach(g => { if (byGroup.has(g.name)) ordered.push(g.name); });
  byGroup.forEach((_, k) => { if (!ordered.includes(k)) ordered.push(k); });

  ordered.forEach(gname => {
    const glist = byGroup.get(gname);

    // Шапка группы (сворачиваемый заголовок)
    const gEl = document.createElement('div');
    gEl.className = 'group collapsed';   // группы свёрнуты по умолчанию
    const gHead = document.createElement('div');
    gHead.className = 'group-head';
    gHead.innerHTML = `<span class="g-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span><span class="g-name"></span><span class="g-count"></span><button class="g-hide" title="Показать/скрыть группу"></button>`;
    gHead.querySelector('.g-name').textContent = gname;
    gHead.querySelector('.g-count').textContent = String(glist.length);
    const hideBtn = gHead.querySelector('.g-hide');
    hideBtn.innerHTML = eyeIcon(false);
    hideBtn.addEventListener('click', (ev) => { ev.stopPropagation(); toggleGroup(glist, hideBtn); });
    gEl.appendChild(gHead);

    // Детали внутри группы
    const gBody = document.createElement('div');
    gBody.className = 'group-body';
    glist.forEach(p => {
      const el = document.createElement('div');
      el.className = 'item on';
      el.innerHTML = `<span class="check"></span><span class="dot" style="background:${new THREE.Color(p.color).getStyle()}"></span><span class="name"></span>`;
      el.querySelector('.name').textContent = p.name;
      el.addEventListener('click', (ev) => { ev.stopPropagation(); toggle(p); });
      p.el = el;
      gBody.appendChild(el);
    });
    gEl.appendChild(gBody);

    gHead.addEventListener('click', () => gEl.classList.toggle('collapsed'));
    listEl.appendChild(gEl);
  });
}

function toggle(p){
  const prev = snapshot();
  p.object.visible = !p.object.visible;
  if (p.el){
    p.el.classList.toggle('on', p.object.visible);
    p.el.classList.toggle('off', !p.object.visible);
  }
  updateCount();
  updateGroupIcons();
  pushHistory(prev);
  needsRender = true;
}

/* Обновить глаз-иконки групп под текущую видимость:
   глаз открыт (синий), если в группе есть хоть одна видимая деталь; перечёркнут
   (серый), если группа полностью скрыта. Вызывается после любого изменения
   видимости (одна деталь / вся группа / «Показать всё» / «Скрыть всё» / undo). */
function updateGroupIcons(){
  document.querySelectorAll('.group').forEach(g => {
    const name = g.querySelector('.g-name').textContent.trim();
    const grp = parts.filter(p => p.group === name);
    const anyVisible = grp.some(p => p.object.visible);
    const hideBtn = g.querySelector('.g-hide');
    if (hideBtn){
      hideBtn.innerHTML = eyeIcon(!anyVisible);
      hideBtn.classList.toggle('off', !anyVisible);
      hideBtn.title = anyVisible ? 'Скрыть группу' : 'Показать группу';
    }
  });
}

/* SVG-иконки глаза (через currentColor): открытый глаз / перечёркнутый глаз */
function eyeIcon(hidden){
  const open = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const off  = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  return hidden ? off : open;
}

/* Скрыть / показать группу целиком */
function toggleGroup(groupParts, hideBtn){
  const prev = snapshot();
  const hide = groupParts.some(p => p.object.visible); // если хоть одна видна — прячем всю
  groupParts.forEach(p => {
    p.object.visible = !hide;
    if (p.el){
      p.el.classList.toggle('on', p.object.visible);
      p.el.classList.toggle('off', !p.object.visible);
    }
  });
  // значок глаза: перечёркнутый (скрыта) / открытый (видима), цвет через currentColor
  if (hideBtn){
    hideBtn.innerHTML = eyeIcon(hide);
    hideBtn.classList.toggle('off', hide);
    hideBtn.title = hide ? 'Показать группу' : 'Скрыть группу';
  }
  updateCount();
  pushHistory(prev);
  needsRender = true;
}

/* ---------- История: Отмена / Вернуть (Undo / Redo) ---------- */
const undoStack = [];
const redoStack = [];
const btnUndo = document.getElementById('btn-undo');

function snapshot(){ return parts.map(p => p.object.visible); }

function applyState(state){
  parts.forEach((p, i) => {
    p.object.visible = state[i];
    if (p.el){
      p.el.classList.toggle('on', p.object.visible);
      p.el.classList.toggle('off', !p.object.visible);
    }
  });
  updateCount();
  updateGroupIcons();
  needsRender = true;
}

function pushHistory(prev){
  undoStack.push(prev);
  redoStack.length = 0;
  updateButtons();
}

function undo(){
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  applyState(undoStack.pop());
  updateButtons();
}

function redo(){
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  applyState(redoStack.pop());
  updateButtons();
}

function updateButtons(){
  const u = undoStack.length > 0;
  btnUndo.disabled = !u; btnUndo.classList.toggle('disabled', !u);
}

btnUndo.addEventListener('click', undo);

// Горячие клавиши
window.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')){
    e.preventDefault(); undo();
  } else if (mod && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')){
    e.preventDefault(); redo();
  }
});

/* ---------- Сбор частей ---------- */
function unwrapRoot(root){
  let node = root;
  while (node.children.length === 1 && !node.children[0].isMesh) node = node.children[0];
  return node;
}
/* ---------- Группы деталей (соответствие структуре Blender) ----------
   Модель выгружается в глTF «плоско» (без узлов-коллекций), поэтому группы
   собираются по именам деталей. Порядок GROUPS задаёт порядок отображения и
   приоритет: первая подошедшая регулярка выигрывает. */
const GROUPS = [
  { name: 'Каркас',         match: /^Каркас|^Обрешетка|^Подшивка/i },             // Каркас×2 + Обрешетка×2 + Подшивка×2
  { name: 'ЦСП',            match: /^ЦСП/i },                                     // ЦСП×2
  { name: 'Сендвич',        match: /Сэндвич|Сендвич|Панель_Кровля/i },            // сендвич + панели кровли
  { name: 'Перегородки',    match: /Стойки|СМЛ/i },                               // Стойки_СМЛ + СМЛ_Панели
  { name: 'Окна',           match: /ОК|OK/i },
  { name: 'Фасонные элементы', match: /Добор|Козырек|Откос|Отлив|Отлиы|Парапет|Планка|Угол/i },
  { name: 'Закладные',      match: /Закладная/i },
  { name: 'Вата',           match: /Вата/i },
  { name: 'ППУ',            match: /ППУ/i },
  { name: 'Прочее',         match: /Площадка|Водосточная|Уплотнитель|Розетки|Нполнение|Дверь|Откос[_-]?Дверь/i },
];
const FALLBACK_GROUP = 'Разное';

function groupForName(name){
  // Приоритет: `Откос_Дверь` всегда в «Прочее», даже если в имени есть «Откос»
  // (иначе его перехватили бы «Фасонные элементы» со своим правилом /Откос/).
  if (/(Откос[_-]?Дверь)/i.test(name)) return 'Прочее';
  for (const g of GROUPS){ if (g.match.test(name)) return g.name; }
  return FALLBACK_GROUP;
}

function collectParts(root){
  const container = unwrapRoot(root);
  parts.length = 0;
  container.children.forEach((child, i) => {
    child.traverse(o => {
      if (o.isMesh){
        o.castShadow = true;
        o.receiveShadow = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          // Нейтральные отражения окружения (как в примере)
          m.envMapIntensity = 0.45;
          m.needsUpdate = true;
        });
      }
    });
    const nm = chooseName(child.name, i);
    parts.push({
      object: child,
      name: nm,
      group: groupForName(nm),
      color: palette[i % palette.length]
    });
  });
  if (parts.length === 0) parts.push({ object: root, name: 'Модель', color: palette[0], group: FALLBACK_GROUP });
  return container;
}

/* ---------- Подгонка камеры ---------- */
function fitCamera(){
  // Габариты считаем только по модели, чтобы пол не попадал в расчёт
  const box = new THREE.Box3().setFromObject(modelRoot || scene);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  if (!isFinite(maxDim) || maxDim === 0) return;
  modelCenter.copy(center);
  modelMaxDim = maxDim;
  addGround(center, maxDim, box.min.y);

  const fov = camera.fov * Math.PI / 180;
  const dist = maxDim / (2 * Math.tan(fov / 2)) * 1.4;
  cameraDist = dist;
  const dirV = new THREE.Vector3(0.6, 0.45, 0.7).normalize();
  camera.position.copy(center).addScaledVector(dirV, dist);
  // Тщательно подбираем near/far под размер модели:
  // большой разброс «сжимает» глубину и ломает screen-space AO и тени.
  camera.near = Math.max(0.001, maxDim * 0.01);
  camera.far  = Math.max(10, maxDim * 30);
  camera.updateProjectionMatrix();
  modelBox = box;
  needsRender = true;
  controls.target.copy(center);
  controls.minDistance = maxDim * 0.05;
  controls.maxDistance = maxDim * 5;
  controls.update();

  placeLights(center, maxDim);
}

/* ---------- Размещение источников света и поворот ----------
   Позиция каждого направленного света = центр модели + (направление, повёрнутое
   на угол azimuth вокруг вертикальной оси Y) * радиус. Вызывается из fitCamera
   и при движении ползунка «Поворот света». */
const LIGHT_AZ = { value: 153 };  // фиксированный азимут света (градусы)
const Y_AXIS = new THREE.Vector3(0, 1, 0);

function placeLights(center, maxDim){
  const d = maxDim * 0.9;   // тень охватывает только модель, без фона
  const ang = LIGHT_AZ.value * Math.PI / 180;
  shadowRig.forEach(l => {
    // поворот базового направления вокруг Y на угол azimuth
    l.userData.dir = l.userData.baseDir.clone().applyAxisAngle(Y_AXIS, ang);
    l.position.copy(center).addScaledVector(l.userData.dir, maxDim * 2);
    l.target.position.copy(center);
    l.shadow.mapSize.set(2048, 2048);
    l.shadow.camera.left = -d; l.shadow.camera.right = d;
    l.shadow.camera.top = d;   l.shadow.camera.bottom = -d;
    l.shadow.camera.near = maxDim * 0.01;
    l.shadow.camera.far  = maxDim * 6;
    l.shadow.camera.updateProjectionMatrix();
    l.shadow.bias = -0.0002;
    l.shadow.normalBias = maxDim * 0.0002;
  });
}

/* ---------- Пол с контактной тенью ----------
   Прозрачная плоскость, которая ловит тень от модели и «ставит» её на
   землю — главный признак фотореализма (объект больше не висит в воздухе). */
function addGround(center, maxDim, floorY){
  if (groundPlane){ scene.remove(groundPlane); groundPlane = null; }
  const geo = new THREE.PlaneGeometry(maxDim * 6, maxDim * 6);
  const mat = new THREE.ShadowMaterial({ opacity: 0.32 });
  groundPlane = new THREE.Mesh(geo, mat);
  groundPlane.rotation.x = -Math.PI / 2;
  groundPlane.position.set(center.x, floorY - maxDim * 0.004, center.z);
  groundPlane.receiveShadow = true;
  scene.add(groundPlane);
}

/* ---------- Настройки Ambient Occlusion (N8AO) ----------
   Фиксированный пресет «Детали»: радиус 100 мм, контраст (intensity) 10,
   точность 24 сэмпла. Ползунки не используются. */
const $id = id => document.getElementById(id);

const AO_DETAILS = { radius: 100, intensity: 10.0, samples: 24 };

function applyAO(){
  if (n8ao){
    n8ao.configuration.aoRadius   = AO_DETAILS.radius;                // мм (мировые юниты)
    n8ao.configuration.aoSamples  = AO_DETAILS.samples;
    n8ao.configuration.intensity  = AO_DETAILS.intensity;             // контраст затемнения (всегда)
    n8ao.configuration.renderMode = 0;                                // Combined (красота + AO)
  }
  needsRender = true;
}
applyAO();

/* ---------- Загрузка ---------- */
const loader = new GLTFLoader();
loader.load('./mops.glb',
  (gltf) => {
    const root = gltf.scene;
    modelRoot = root;
    scene.add(root);
    scene.updateMatrixWorld(true);
    collectParts(root);
    buildList();
    buildPartMap();
    fitCamera();
    updateCount();
    applyAO();
    overlay.classList.add('gone');
    setTimeout(() => overlay.remove(), 600);
    setTimeout(() => document.getElementById('hint').classList.add('fade'), 6000);
  },
  (xhr) => { if (xhr.total) loadMsg.textContent = `Загружаем модель… ${Math.min(100, Math.round(xhr.loaded / xhr.total * 100))}%`; },
  (err) => {
    console.error(err);
    overlay.querySelector('.spinner').style.display = 'none';
    loadMsg.style.display = 'none';
    loadErr.style.display = 'block';
    loadErr.textContent = 'Не удалось загрузить модель. Если открыли файл напрямую (file://), браузер блокирует загрузку — опубликуйте на GitHub Pages или запустите локальный сервер.';
  }
);

/* ---------- Кнопки ---------- */
document.getElementById('btn-all').onclick  = () => { const prev = snapshot(); parts.forEach(p => { p.object.visible = true;  if(p.el){p.el.classList.add('on'); p.el.classList.remove('off');} }); updateCount(); updateGroupIcons(); pushHistory(prev); needsRender = true; };
document.getElementById('btn-none').onclick = () => { const prev = snapshot(); parts.forEach(p => { p.object.visible = false; if(p.el){p.el.classList.remove('on'); p.el.classList.add('off');} }); updateCount(); updateGroupIcons(); pushHistory(prev); needsRender = true; };

/* ---------- Сворачиваемый список деталей ----------
   Стрелка вверху списка: по клику список сворачивается вверх (▲) и
   разворачивается вниз (▼). */
const listToggle  = $id('list-toggle');
const listChevron = $id('list-chevron');
listToggle.addEventListener('click', () => {
  const collapsed = listEl.classList.toggle('collapsed');
  listChevron.textContent = collapsed ? '▼' : '▲';
});

/* ---------- Двойной клик по детали ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const partByUuid = new Map();
function buildPartMap(){
  partByUuid.clear();
  parts.forEach(p => p.object.traverse(o => { if (o.isMesh) partByUuid.set(o.uuid, p); }));
}
function setPointer(e){
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}
function pickPart(e){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const objs = parts.filter(p => p.object.visible).map(p => p.object);
  if (!objs.length) return null;
  const hits = raycaster.intersectObjects(objs, true);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && !partByUuid.has(obj.uuid)) obj = obj.parent;
  return obj ? partByUuid.get(obj.uuid) : null;
}

let lastClickT = 0, lastClickX = -9999, lastClickY = -9999;
let downX = 0, downY = 0, dragMoved = false;
canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; dragMoved = false; });
canvas.addEventListener('pointerup', (e) => {
  if (e.button !== 0) return;
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY) > 6;
  // [РУЛЕТКА ОТКЛЮЧЕНА] Перетаскивание — просто игнорируем (не скрываем деталь по случайному двойному клику).
  if (moved) return;
  // [РУЛЕТКА ОТКЛЮЧЕНА]
  // if (measure.on){ placeMeasurePoint(e); lastClickT = 0; lastClickX = -9999; lastClickY = -9999; return; }
  const now = performance.now();
  const near = Math.hypot(e.clientX - lastClickX, e.clientY - lastClickY) < 8;
  if (near && (now - lastClickT) < 350){
    const p = pickPart(e);
    if (p) toggle(p);
    lastClickT = 0; lastClickX = -9999; lastClickY = -9999;
  } else {
    lastClickT = now; lastClickX = e.clientX; lastClickY = e.clientY;
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) dragMoved = true;
  // Во время замера: показываем красный кружок-прицел, не переопределяем курсор
  if (measure.on){
    updateSnapPreview(e);
    return;
  }
  canvas.style.cursor = pickPart(e) ? 'pointer' : 'grab';
});

/* ---------- Рулетка (замер расстояния) ----------
   Иконка в правом верхнем углу включает режим замера: курсор — синий кружок.
   Клики по модели ставят точки (с привязкой к ближайшей вершине или ребру), две
   точки соединяются синей линией, над серединой — размер. Пока рулетка активна,
   модель можно свободно вращать/приближать (точки закреплены в пространстве
   модели); маркеры держат постоянный экранный размер независимо от зума.
   Завершённая линия исчезает при повороте модели (перетаскивании), Esc — выход. */
const measure = { on:false, p1:null, dot1:null, line:null };
const measureBtn = document.getElementById('measure-btn');
const measureLabel = document.getElementById('measure-label');
const MEASURE_COLOR = 0x3fa9f5;
const MARKER_PX = 6;    // постоянный экранный радиус точек (пиксели)
const LINE_PX   = 2.5;  // постоянная экранная толщина линии (пиксели)
const MEASURE_CURSOR = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><circle cx='15' cy='15' r='11' fill='rgba(63,169,245,.18)' stroke='%233fa9f5' stroke-width='2'/><circle cx='15' cy='15' r='2.5' fill='%233fa9f5'/></svg>\") 15 15, crosshair";

// Объекты, чей размер поддерживается постоянным на экране: {obj, getPos, isCyl, px}
const screenMarkers = [];
function registerScreenMarker(obj, getPos, isCyl, px, persistent, keepY){
  screenMarkers.push({ obj, getPos, isCyl, px, persistent: !!persistent, keepY: !!keepY });
}

// Красный кружок-прицел рулетки: появляется, когда курсор «примагничен» к ближайшей
// вершине или ребру, показывая куда попадёт точка по клику. Держит постоянный
// экранный размер и не удаляется при очистке замера (persistent=true).
const PREVIEW_PX = 8;
const PREVIEW_COLOR = 0xff3b30;
const snapPreview = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 20),
  new THREE.MeshBasicMaterial({ color: PREVIEW_COLOR, depthTest: false, transparent: true, opacity: 0.9 }));
snapPreview.renderOrder = 6000;
snapPreview.visible = false;
scene.add(snapPreview);
registerScreenMarker(snapPreview, () => snapPreview.position, false, PREVIEW_PX, true);

// Призрак-линия замера: после первой точки показывает «линейку на 90°» — прямой
// отрезок вдоль выбранной оси, чтобы было видно, какой размер получится, и можно
// было поправить, прежде чем кликнуть. Красный, полупрозрачный, постоянной толщины.
const ghostLine = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 10, 1, false),
  new THREE.MeshBasicMaterial({ color: 0xff5a5a, depthTest: true, transparent: true, opacity: 0.5 }));
ghostLine.renderOrder = 5900;
ghostLine.visible = false;
scene.add(ghostLine);
registerScreenMarker(ghostLine, () => ghostLine.position, true, LINE_PX, /*persistent*/ true, /*keepY*/ true);

// Спроецировать точку c на главную мировую ось (X/Y/Z) относительно p1, чтобы линия
// шла строго параллельно оси (под 90°), а не по диагонали — размер получается
// корректным (прямая длина по оси, а не гипотенуза).
function lockAxis(p1, c){
  const dx = Math.abs(c.x - p1.x), dy = Math.abs(c.y - p1.y), dz = Math.abs(c.z - p1.z);
  const out = p1.clone();
  if (dx >= dy && dx >= dz){ out.x = c.x; }
  else if (dy >= dz){ out.y = c.y; }
  else { out.z = c.z; }
  return out;
}

// Пересчитать размеры маркеров под текущую камеру (каждый кадр),
// чтобы точки/линия не «раздувались» при приближении и не исчезали при отдалении.
function updateScreenMarkers(){
  if (!screenMarkers.length) return;
  const H = canvas.clientHeight || 1;
  const t = Math.tan(camera.fov * Math.PI / 360);
  for (const m of screenMarkers){
    const r = m.px * 2 * t / Math.max(H, 1) * m.getPos().distanceTo(camera.position);
    if (m.isCyl){ m.obj.scale.set(r, 1, r); }
    else { m.obj.scale.setScalar(r); }
  }
}

// Спроецировать мировую точку в экранные координаты (для подписи с размером)
function worldToScreen(v){
  const p = v.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  return { x: (p.x * 0.5 + 0.5) * rect.width, y: (-p.y * 0.5 + 0.5) * rect.height, ndcZ: p.z };
}

// Ближайшая точка на отрезке AB к точке P (для привязки к ребру)
function closestOnSeg(p, a, b){
  const ab = new THREE.Vector3().subVectors(b, a);
  const t = Math.max(0, Math.min(1, new THREE.Vector3().subVectors(p, a).dot(ab) / Math.max(ab.lengthSq(), 1e-9)));
  return a.clone().addScaledVector(ab, t);
}

// Луч в сцену; возвращает пересечение (объект, грань, точку) или null
function raycastModel(e){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const objs = parts.filter(p => p.object.visible).map(p => p.object);
  if (!objs.length) return null;
  const hits = raycaster.intersectObjects(objs, true);
  return hits.length ? hits[0] : null;
}

// Привязка точки к ближайшей вершине/ребру треугольника
function snapToMesh(hit){
  const point = hit.point;
  const pos = hit.object.geometry.attributes.position;
  const m = hit.object.matrixWorld;
  const ia = hit.face.a, ib = hit.face.b, ic = hit.face.c;
  const va = new THREE.Vector3().fromBufferAttribute(pos, ia).applyMatrix4(m);
  const vb = new THREE.Vector3().fromBufferAttribute(pos, ib).applyMatrix4(m);
  const vc = new THREE.Vector3().fromBufferAttribute(pos, ic).applyMatrix4(m);
  const cands = [{pt: va, d: va.distanceTo(point)}, {pt: vb, d: vb.distanceTo(point)}, {pt: vc, d: vc.distanceTo(point)}];
  [[va, vb], [vb, vc], [vc, va]].forEach(([A, B]) => {
    const C = closestOnSeg(point, A, B);
    cands.push({pt: C, d: C.distanceTo(point)});
  });
  cands.sort((x, y) => x.d - y.d);
  const snapDist = modelMaxDim * 0.03;   // «магнит» ~3% габарита модели
  const snapped = cands[0].d <= snapDist;
  return { pt: snapped ? cands[0].pt : point, snapped };
}

// Обновить красный кружок-прицел по позиции курсора: показывается только когда
// точка «примагничена» к вершине/ребру (по клику установится именно она), чтобы
// было видно, куда попадёт клик, но при этом не мешало искать другую грань.
function updateSnapPreview(e){
  const hit = raycastModel(e);
  if (!hit){
    if (snapPreview.visible){ snapPreview.visible = false; needsRender = true; }
    return;
  }
  const s = snapToMesh(hit);
  if (!s.snapped){
    if (snapPreview.visible){ snapPreview.visible = false; needsRender = true; }
    return;
  }
  if (!snapPreview.visible){
    snapPreview.visible = true;
    snapPreview.position.copy(s.pt);
    needsRender = true;
  } else if (snapPreview.position.distanceToSquared(s.pt) > 1e-6){
    snapPreview.position.copy(s.pt);
    needsRender = true;
  }
}

// Запомнить первую точку (маленькая точка с постоянным экранным размером)
function placeMeasurePoint(e){
  const hit = raycastModel(e);
  if (!hit) return;
  const pt = snapToMesh(hit).pt;
  if (!measure.p1){
    measure.p1 = pt;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16),
      new THREE.MeshBasicMaterial({ color: MEASURE_COLOR, depthTest: false, transparent: true, opacity: 0.95 }));
    dot.position.copy(pt);
    dot.renderOrder = 6000;
    scene.add(dot);
    measure.dot1 = dot;
    registerScreenMarker(dot, () => pt, false, MARKER_PX);
    needsRender = true;
    return;
  }
  // вторая точка — рисуем линию между p1 и pt
  drawMeasure(measure.p1, pt);
  measure.p1 = null;
  measure.on = false;            // выходим из режима постановки точек
  setCursorMeasure(false);
  measureBtn.classList.remove('on');
  needsRender = true;
}

// Линия постоянной (пересчитываемой) толщины + две точки постоянного размера
function makeLine(a, b){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: MEASURE_COLOR, depthTest: false, transparent: true, opacity: 0.95 });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, len, 12, 1, false), mat);
  cyl.position.copy(a).add(b).multiplyScalar(0.5);
  cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  cyl.renderOrder = 6000;
  group.add(cyl);
  const dotGeo = new THREE.SphereGeometry(1, 16, 16);
  const dotA = new THREE.Mesh(dotGeo, mat); dotA.position.copy(a); dotA.renderOrder = 6000;
  const dotB = new THREE.Mesh(dotGeo, mat); dotB.position.copy(b); dotB.renderOrder = 6000;
  group.add(dotA); group.add(dotB);
  group.userData.pA = a; group.userData.pB = b;
  registerScreenMarker(cyl, () => new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5), true, LINE_PX);
  registerScreenMarker(dotA, () => a, false, MARKER_PX);
  registerScreenMarker(dotB, () => b, false, MARKER_PX);
  return group;
}

function drawMeasure(a, b){
  clearMeasure();          // убрать предыдущий замер / незавершённую точку
  measure.line = makeLine(a, b);
  scene.add(measure.line);
  updateMeasureLabel();
  needsRender = true;
}

// Подпись с размером над серединой линии (позиция обновляется каждый кадр)
function updateMeasureLabel(){
  if (!measure.line) return;
  const a = measure.line.userData.pA, b = measure.line.userData.pB;
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const s = worldToScreen(mid);
  const dist = a.distanceTo(b);
  const txt = dist >= 1000 ? (dist / 1000).toFixed(2) + ' м' : Math.round(dist) + ' мм';
  measureLabel.textContent = txt;
  measureLabel.style.display = 'block';
  measureLabel.style.left = s.x + 'px';
  measureLabel.style.top = (s.y - 26) + 'px';
}

// Убрать только завершённую линию (незавершённую первую точку не трогаем)
function clearCompletedLine(){
  if (measure.line){ scene.remove(measure.line); measure.line = null; }
  measureLabel.style.display = 'none';
  needsRender = true;
}

// Убрать всё: линию, незавершённую точку и подпись
function clearMeasure(){
  if (measure.line){ scene.remove(measure.line); measure.line = null; }
  if (measure.dot1){ scene.remove(measure.dot1); measure.dot1 = null; }
  measure.p1 = null;
  measureLabel.style.display = 'none';
  snapPreview.visible = false;
  // убрать только маркеры линии/точек (красный прицел остаётся зарегистрированным)
  for (let i = screenMarkers.length - 1; i >= 0; i--){
    if (!screenMarkers[i].persistent) screenMarkers.splice(i, 1);
  }
  needsRender = true;
}

function setCursorMeasure(on){
  canvas.style.cursor = on ? MEASURE_CURSOR : 'grab';
}

// Для отладки/тестов
window.__measure = measure;
window.__markers = screenMarkers;
window.__camera = camera;
window.__snapPreview = snapPreview;

measureBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (measure.on){
    // повторно кликнули иконку — выключить и убрать замер
    measure.on = false;
    clearMeasure();
    setCursorMeasure(false);
    measureBtn.classList.remove('on');
  } else {
    clearMeasure();
    measure.on = true;
    setCursorMeasure(true);
    measureBtn.classList.add('on');
  }
});

// Esc — отменяет/выходит из режима замера полностью
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    const wasOn = measure.on;
    clearMeasure();
    if (wasOn){
      measure.on = false;
      setCursorMeasure(false);
      measureBtn.classList.remove('on');
    }
  }
});

/* ---------- Кубик видов ---------- */
const cubeEl = document.getElementById('cube');
const tmpBasis = new THREE.Matrix4();

function setView(n){
  const center = modelCenter.clone();
  const dist = cameraDist;
  camera.position.copy(center).addScaledVector(n.clone().normalize(), dist);
  controls.target.copy(center);
  controls.update();
}
document.querySelectorAll('.face').forEach(f => {
  f.addEventListener('click', (e) => {
    e.stopPropagation();
    const d = f.dataset.dir.split(',').map(Number);
    setView(new THREE.Vector3(d[0], d[1], d[2]));
  });
});

function updateViewCube(){
  // three.js — правая система (Y вверх); CSS 3D — правая система (Y вниз).
  // Обратный поворот камеры + сопряжение отражения по Y (S·R·S),
  // чтобы куб вращался синхронно с камерой и показывал нужные грани.
  tmpBasis.makeRotationFromQuaternion(camera.quaternion);
  tmpBasis.invert();
  const e = tmpBasis.elements;
  const css = [
    e[0], -e[1], e[2], 0,
   -e[4],  e[5], -e[6], 0,
    e[8], -e[9], e[10], 0,
    0,0,0,1
  ];
  cubeEl.style.transform = 'matrix3d(' + css.join(',') + ')';
}

/* ---------- Ресайз ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  needsRender = true;
});

/* ---------- Отложенный рендер ----------
   AO при движении камеры пересчитывается каждый кадр (это быстро), но когда
   камера неподвижна — кадр не тратится. */
controls.addEventListener('change', () => { needsRender = true; });

renderer.setAnimationLoop(() => {
  controls.update();
  updateViewCube();
  updateScreenMarkers();          // держим точки/линию постоянного экранного размера
  if (measure.line) updateMeasureLabel();  // подпись следует за линией при зуме
  if (needsRender){
    composer.render();
    needsRender = false;
  }
});
</script>
