<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Viewer</title>
  <style>
    :root {
      --bg: #101418;
      --panel: #161c22;
      --panel2: #1e262e;
      --border: #2b3540;
      --text: #e7edf3;
      --muted: #93a1ad;
      --accent: #3fa9f5;
      --accent2: #2b6cff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app {
      position: relative;
      height: 100vh;
      width: 100vw;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }
    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 20;
      width: 300px;
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      overflow: hidden;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .head .badge {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0b1a4a;
      border: none;
    }
    .head .badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .head h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
    }
    .head .sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .actions {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .btn {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.2;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      user-select: none;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      text-align: center;
      overflow: hidden;
    }
    .btn:hover {
      background: #26303a;
      border-color: #3a4b5c;
    }
    .btn.primary {
      border-color: var(--accent2);
    }
    .btn.disabled, .btn[disabled] {
      opacity: .4;
      cursor: not-allowed;
      background: #1a2027;
      border-color: var(--border);
      color: var(--muted);
    }
    .btn.disabled:hover, .btn[disabled]:hover {
      background: #1a2027;
      border-color: var(--border);
    }
    .actions-row {
      display: flex;
      gap: 8px;
    }
    .actions-row.actions-row {
      margin-top: 8px;
    }
    .list-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 13px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .3px;
      transition: background .12s;
    }
    .list-toggle:hover {
      background: var(--panel2);
    }
    .list-toggle .chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 10px;
      line-height: 1;
      transition: transform .18s, background .12s;
    }
    .list-toggle:hover .chevron {
      background: #26303a;
      border-color: var(--accent);
    }
    .list.collapsed {
      display: none;
    }
    .hist-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hist-btn .hist-label {
      display: block;
      line-height: 1.2;
      overflow: hidden;
    }
    .hist-btn .arrow {
      font-size: 15px;
      line-height: 1;
    }
    .hist-btn .kbd {
      font-size: 10px;
      color: var(--muted);
      opacity: .7;
      margin-left: 2px;
    }
    .btn-undo {
      border-color: #3a4b5c;
    }
    .hotkey-note {
      font-size: 10px;
      color: var(--muted);
      opacity: .6;
      text-align: center;
      margin-top: 5px;
    }
    .list {
      overflow-y: auto;
      flex: 1;
      padding: 6px;
      scrollbar-width: thin;
      scrollbar-color: #3a4b5c transparent;
    }
    .list::-webkit-scrollbar {
      width: 9px;
    }
    .list::-webkit-scrollbar-thumb {
      background: #3a4b5c;
      border-radius: 8px;
      border: 2px solid var(--panel);
    }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      margin: 3px 0;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: background .12s, border-color .12s;
    }
    .item:hover {
      background: var(--panel2);
      border-color: var(--border);
    }
    .item .check {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid #5a6a78;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, border-color .12s;
    }
    .item.on .check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .item .check::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: #fff;
      transform: scale(0);
      transition: transform .12s;
    }
    .item.on .check::after {
      transform: scale(1);
    }
    .item .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none;
    }
    .item .name {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item.off .name {
      color: var(--muted);
      text-decoration: line-through;
    }
    .group {
      margin-bottom: 4px;
    }
    .group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      margin: 3px 0;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      background: var(--panel2);
      border: 1px solid var(--border);
      transition: background .12s, border-color .12s;
    }
    .group-head:hover {
      background: #26303a;
      border-color: #3a4b5c;
    }
    .group-head .g-chev {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      flex: none;
      color: var(--accent);
      transition: transform .15s;
      transform: rotate(0deg);
    }
    .group-head .g-chev svg {
      display: block;
      width: 16px;
      height: 16px;
    }
    .group.collapsed .group-head .g-chev {
      transform: rotate(-90deg);
    }
    .group-head .g-name {
      flex: 1;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .group-head .g-count {
      flex: none;
      font-size: 11px;
      color: var(--muted);
      background: rgba(0,0,0,.25);
      border-radius: 10px;
      padding: 1px 7px;
    }
    .g-hide {
      flex: none;
      width: 26px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      color: var(--accent);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
      user-select: none;
    }
    .g-hide:hover {
      background: #0d1117;
      border-color: var(--accent);
    }
    .g-hide.off {
      color: var(--muted);
      border-color: var(--border);
      background: var(--panel2);
    }
    .g-hide.off:hover {
      color: var(--text);
      border-color: var(--muted);
    }
    .group-body {
      padding-left: 8px;
      border-left: 1px solid var(--border);
      margin-left: 9px;
    }
    .group.collapsed .group-body {
      display: none;
    }
    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--muted);
      gap: 16px;
      transition: opacity .5s;
    }
    #overlay.gone {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid #22303a;
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #overlay .msg {
      font-size: 14px;
    }
    #overlay .err {
      color: #e5484d;
      max-width: 440px;
      text-align: center;
      line-height: 1.5;
      display: none;
    }
    .light-section {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    .light-section h4 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .3px;
    }
    .ctl {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .ctl label {
      flex: 1;
    }
    .ctl input[type="range"] {
      flex: 2;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 5px;
      background: var(--panel2);
      outline: none;
      cursor: pointer;
    }
    .ctl input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #0b0e11;
    }
    .ctl input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #0b0e11;
    }
    .ctl .val {
      width: 34px;
      text-align: right;
      color: var(--text);
    }
    .ao-block {
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }
    .ao-toggle label {
      flex: none;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
    }
    .ao-toggle input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .online {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }
    @media (max-width: 560px) {
      #panel {
        width: min(280px, calc(100vw - 32px));
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/",
        "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.35.0/build/index.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="panel">
      <div class="head">
        <div class="badge">
          <img src=".channels/4/profile.jpg" alt="">
        </div>
        <div>
          <h1>3D Viewer</h1>
          <div class="sub">Модуль просмотра модели</div>
        </div>
      </div>

      <div class="actions">
        <div class="actions-row">
          <button class="btn" id="btn-all">Показать всё</button>
          <button class="btn" id="btn-none">Скрыть всё</button>
        </div>
        <div class="actions-row">
          <button class="btn hist-btn" id="btn-undo" title="Ctrl+Z" disabled>
            <span class="hist-label"><span class="arrow">↶</span> <span class="kbd">Ctrl+Z</span></span>
          </button>
        </div>
      </div>

      <div class="list-toggle" id="list-toggle">
        <span>Список объектов</span>
        <span class="chevron" id="list-chevron">▼</span>
      </div>

      <div class="list" id="list">
        <div class="empty">Загрузка модели…</div>
      </div>

      <div class="foot">
        <span id="hidden-count">0</span> скрыто
      </div>

      <div class="light-section">
        <h4>Освещение</h4>
        <div class="ctl">
          <label>Азимут</label>
          <input type="range" id="light-az" min="0" max="360" value="153" />
          <span class="val" id="light-az-val">153°</span>
        </div>
        <div class="ao-block">
          <div class="ao-toggle">
            <label>
              <input type="checkbox" id="ao-toggle" checked />
              Включить AO
            </label>
          </div>
          <div class="online">N8AO включён</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <div class="spinner"></div>
      <div class="msg" id="load-msg">Загрузка сцены…</div>
      <div class="err" id="load-err"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
    import { N8AOPass } from 'https://cdn.jsdelivr.net/npm/n8ao@2.0.1/dist/N8AO.js';

    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const loadMsg = document.getElementById('load-msg');
    const loadErr = document.getElementById('load-err');

    // ---------- Renderer & Scene ----------
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    scene.environmentIntensity = 0.5;
    pmrem.dispose();

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8a929b, 1.0);
    scene.add(hemiLight);

    const ambient = new THREE.AmbientLight(0xffffff, 0.32);
    scene.add(ambient);

    const shadowRig = [];
    function addShadowLight(dirVec, intensity) {
      const l = new THREE.DirectionalLight(0xffffff, intensity);
      l.castShadow = true;
      l.userData.baseDir = dirVec.clone().normalize();
      l.userData.dir = l.userData.baseDir.clone();
      scene.add(l);
      scene.add(l.target);
      shadowRig.push(l);
      return l;
    }
    addShadowLight(new THREE.Vector3(0.75, 0.4, 0.6), 0.55);
    addShadowLight(new THREE.Vector3(-0.9, 0.5, 0.3), 0.55);
    addShadowLight(new THREE.Vector3(0.3, 0.5, -0.9), 0.55);

    // ---------- Camera & Controls ----------
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100000);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;

    // ---------- N8AO (SSAO) ----------
    const composer = new EffectComposer(renderer);
    const n8ao = new N8AOPass(scene, camera, window.innerWidth, window.innerHeight);
    window.n8ao = n8ao;
    n8ao.configuration.aoRadius = 300;
    n8ao.configuration.distanceFalloff = 1.0;
    n8ao.configuration.aoSamples = 24;
    n8ao.configuration.denoiseSamples = 8;
    n8ao.configuration.denoiseRadius = 12;
    n8ao.configuration.denoiseIterations = 2;
    n8ao.configuration.intensity = 5.0;
    n8ao.configuration.screenSpaceRadius = false;
    n8ao.configuration.gammaCorrection = true;
    n8ao.configuration.renderMode = 0; // Combined AO
    n8ao.configuration.halfRes = false;
    n8ao.configuration.depthAwareUpsampling = true;
    composer.addPass(n8ao);
    composer.addPass(new SMAAPass(window.innerWidth, window.innerHeight));

    let needsRender = true;

    // ---------- Parts & UI ----------
    const parts = [];
    const listEl = document.getElementById('list');
    const palette = [0x4aa8ff,0xff7a6b,0x5ad38f,0xffc04d,0xb98bff,0x51d1d6,0xff8fd1,0xa7c957];

    let modelCenter = new THREE.Vector3();
    let modelMaxDim = 1;
    let cameraDist = 1;
    let modelRoot = null;
    let groundPlane = null;
    let modelBox = null;

    function updateCount() {
      const v = parts.filter(p => p.object.visible).length;
      document.getElementById('hidden-count').textContent = String(parts.length - v);
    }

    function chooseName(n, i) {
      if (n && n.trim()) return n.trim();
      return String(i + 1);
    }

    function buildList() {
      listEl.innerHTML = '';
      if (parts.length === 0) {
        listEl.innerHTML = '<div class="empty">Нет объектов</div>';
        return;
      }

      // GROUPS
      const byGroup = new Map();
      parts.forEach(p => {
        if (!byGroup.has(p.group)) byGroup.set(p.group, []);
        byGroup.get(p.group).push(p);
      });

      const ordered = [];
      GROUPS.forEach(g => {
        if (byGroup.has(g.name)) ordered.push(g.name);
      });
      byGroup.forEach((_, k) => {
        if (!ordered.includes(k)) ordered.push(k);
      });

      ordered.forEach(gname => {
        const glist = byGroup.get(gname);
        const gEl = document.createElement('div');
        gEl.className = 'group collapsed';

        const gHead = document.createElement('div');
        gHead.className = 'group-head';
        gHead.innerHTML = `
          <span class="g-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
          <span class="g-name"></span>
          <span class="g-count"></span>
          <button class="g-hide" title=""></button>
        `;
        gHead.querySelector('.g-name').textContent = gname;
        gHead.querySelector('.g-count').textContent = String(glist.length);

        const hideBtn = gHead.querySelector('.g-hide');
        hideBtn.innerHTML = eyeIcon(false);
        hideBtn.addEventListener('click', ev => {
          ev.stopPropagation();
          toggleGroup(glist, hideBtn);
        });

        gEl.appendChild(gHead);

        const gBody = document.createElement('div');
        gBody.className = 'group-body';

        glist.forEach(p => {
          const el = document.createElement('div');
          el.className = 'item on';
          el.innerHTML = `
            <span class="check"></span>
            <span class="dot" style="background:${new THREE.Color(p.color).getStyle()}"></span>
            <span class="name"></span>
          `;
          el.querySelector('.name').textContent = p.name;
          el.addEventListener('click', ev => {
            ev.stopPropagation();
            toggle(p);
          });
          el.addEventListener('mouseenter', () => setPartHighlight(p, true));
          el.addEventListener('mouseleave', () => setPartHighlight(p, false));
          p.el = el;
          gBody.appendChild(el);
        });

        gEl.appendChild(gBody);

        gHead.addEventListener('click', () => {
          gEl.classList.toggle('collapsed');
        });

        gHead.addEventListener('mouseenter', () => setGroupHighlight(glist, true));
        gHead.addEventListener('mouseleave', () => setGroupHighlight(glist, false));

        listEl.appendChild(gEl);
      });
    }

    function toggle(p) {
      const prev = snapshot();
      p.object.visible = !p.object.visible;
      if (p.el) {
        p.el.classList.toggle('on', p.object.visible);
        p.el.classList.toggle('off', !p.object.visible);
      }
      updateCount();
      pushHistory(prev);
      needsRender = true;
    }

    function eyeIcon(hidden) {
      const open = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
      const off = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      return hidden ? off : open;
    }

    function toggleGroup(groupParts, hideBtn) {
      const prev = snapshot();
      const hide = groupParts.some(p => p.object.visible);
      groupParts.forEach(p => {
        p.object.visible = !hide;
        if (p.el) {
          p.el.classList.toggle('on', p.object.visible);
          p.el.classList.toggle('off', !p.object.visible);
        }
      });
      if (hideBtn) {
        hideBtn.innerHTML = eyeIcon(hide);
        hideBtn.classList.toggle('off', hide);
        hideBtn.title = hide ? 'Показать группу' : 'Скрыть группу';
      }
      updateCount();
      pushHistory(prev);
      needsRender = true;
    }

    function setAllVisibility(visible) {
      const prev = snapshot();
      parts.forEach(p => {
        p.object.visible = visible;
        if (p.el) {
          p.el.classList.toggle('on', visible);
          p.el.classList.toggle('off', !visible);
        }
      });
      document.querySelectorAll('.group').forEach(g => {
        const btn = g.querySelector('.g-hide');
        if (btn) {
          btn.innerHTML = eyeIcon(!visible);
          btn.classList.toggle('off', !visible);
          btn.title = visible ? 'Скрыть группу' : 'Показать группу';
        }
      });
      updateCount();
      pushHistory(prev);
      needsRender = true;
    }

    document.getElementById('btn-all')?.addEventListener('click', () => setAllVisibility(true));
    document.getElementById('btn-none')?.addEventListener('click', () => setAllVisibility(false));

    // ---------- Highlight (GPU) ----------
    const HILITECOLOR = new THREE.Color(0x63b9ff);
    const HILITEINTENSITY = 0.85;
    const XRAYRENDERORDER = 5000;

    const hlSaved = new Map(); // material -> {emissive, emissiveIntensity, depthTest, depthWrite}
    const objSaved = new Map(); // mesh -> baseRenderOrder
    let hlActive = new Set();
    let hlParts = null;
    let hlId = null;

    function collectMeshes(partsArr) {
      const meshes = new Set();
      partsArr.forEach(p => {
        p.object.traverse(o => {
          if (o.isMesh) meshes.add(o);
        });
      });
      return meshes;
    }

    function applyHilite(meshes, on) {
      meshes.forEach(o => {
        if (!o.isMesh) return;
        if (on) {
          if (!objSaved.has(o)) objSaved.set(o, o.renderOrder);
          o.renderOrder = XRAYRENDERORDER;
        } else {
          const ro = objSaved.get(o);
          if (ro !== undefined) o.renderOrder = ro;
          objSaved.delete(o);
        }

        const arr = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
        arr.forEach(m => {
          if (!m) return;
          if (on) {
            if (!hlSaved.has(m)) {
              hlSaved.set(m, {
                emissive: m.emissive ? m.emissive.clone() : null,
                emissiveIntensity: m.emissiveIntensity,
                depthTest: m.depthTest,
                depthWrite: m.depthWrite,
              });
            }
            if (m.emissive) {
              m.emissive.copy(HILITECOLOR);
              m.emissiveIntensity = HILITEINTENSITY;
            }
            m.depthTest = false;
            m.depthWrite = false;
            hlActive.add(m);
          } else {
            const saved = hlSaved.get(m);
            if (saved) {
              if (saved.emissive) {
                m.emissive = m.emissive || new THREE.Color();
                m.emissive.copy(saved.emissive);
              }
              m.emissiveIntensity = saved.ei;
              m.depthTest = saved.dt;
              m.depthWrite = saved.dw;
              hlSaved.delete(m);
              hlActive.delete(m);
            }
          }
        });
      });
    }

    function setHilite(partsArr, on, id) {
      if (!partsArr || !partsArr.length) return;
      if (on && hlId === id) return;
      if (!on && hlId !== id) return;

      if (hlParts && hlId !== id) {
        applyHilite(collectMeshes(hlParts), false);
      }

      applyHilite(collectMeshes(partsArr), on);
      hlParts = on ? partsArr : null;
      hlId = on ? id : null;
      needsRender = true;
    }

    function setGroupHighlight(groupParts, on) {
      setHilite(groupParts, on, groupParts);
    }

    function setPartHighlight(part, on) {
      setHilite([part], on, part);
    }

    // ---------- Undo / Redo ----------
    const undoStack = [];
    const redoStack = [];
    const btnUndo = document.getElementById('btn-undo');

    function snapshot() {
      return parts.map(p => p.object.visible);
    }

    function applyState(state) {
      parts.forEach((p, i) => {
        p.object.visible = state[i];
        if (p.el) {
          p.el.classList.toggle('on', p.object.visible);
          p.el.classList.toggle('off', !p.object.visible);
        }
      });
      updateCount();
      needsRender = true;
    }

    function pushHistory(prev) {
      undoStack.push(prev);
      redoStack.length = 0;
      updateButtons();
    }

    function undo() {
      if (!undoStack.length) return;
      redoStack.push(snapshot());
      applyState(undoStack.pop());
      updateButtons();
    }

    function redo() {
      if (!redoStack.length) return;
      undoStack.push(snapshot());
      applyState(redoStack.pop());
      updateButtons();
    }

    function updateButtons() {
      const u = undoStack.length > 0;
      btnUndo.disabled = !u;
      btnUndo.classList.toggle('disabled', !u);
    }

    btnUndo.addEventListener('click', undo);
    window.addEventListener('keydown', e => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) {
        e.preventDefault();
        undo();
      } else if (mod && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) {
        e.preventDefault();
        redo();
      }
    });

    // ---------- Helpers ----------
    function unwrapRoot(root) {
      let node = root;
      while (node.children.length === 1 && !node.children[0].isMesh) {
        node = node.children[0];
      }
      return node;
    }

    // ---------- Blender / Groups ----------
    const GROUPS = [
      { name: 'Стены', match: /^(стена|wall|стенка)/i },
      { name: 'Окна', match: /^(окно|window|оконн)/i },
      { name: 'Двери', match: /^(дверь|door|дверн)/i },
      { name: 'Крыша', match: /^(крыш|roof)/i },
      { name: 'Пол', match: /^(пол|floor)/i },
      { name: 'Каркас', match: /^(каркас|frame|рама)/i },
      { name: 'Фермы', match: /^(ферм|truss)/i },
      { name: 'Обшивка', match: /^(обшив|clad|siding)/i },
      { name: 'Утеплитель', match: /^(утепл|insul)/i },
      { name: 'Крепёж', match: /^(крепёж|fastener|болт|винт|гайка)/i },
      { name: 'Прочее', match: /^/i },
    ];
    const FALLBACKGROUP = 'Прочее';

    function groupForName(name) {
      if (/^-?\d+$/i.test(name)) return FALLBACKGROUP;
      for (const g of GROUPS) {
        if (g.match.test(name)) return g.name;
      }
      return FALLBACKGROUP;
    }

    function collectParts(root) {
      const container = unwrapRoot(root);
      parts.length = 0;
      container.children.forEach((child, i) => {
        child.traverse(o => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            if (Array.isArray(o.material)) {
              o.material = o.material.map(m => {
                const c = m.clone();
                c.envMapIntensity = 0.45;
                c.needsUpdate = true;
                return c;
              });
            } else if (o.material) {
              o.material = o.material.clone();
              o.material.envMapIntensity = 0.45;
              o.material.needsUpdate = true;
            }
            const nm = chooseName(child.name, i);
            parts.push({
              object: o,
              name: nm,
              group: groupForName(nm),
              color: palette[i % palette.length],
            });
          }
        });
      });
      if (parts.length === 0) {
        parts.push({
          object: root,
          name: 'Модель',
          group: FALLBACKGROUP,
          color: palette[0],
        });
      }
      return container;
    }

    // ---------- Fit Camera ----------
    function fitCamera() {
      const box = new THREE.Box3().setFromObject(modelRoot);
      if (box.isEmpty()) return;

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (!isFinite(maxDim) || maxDim === 0) return;

      modelCenter.copy(center);
      modelMaxDim = maxDim;

      addGround(center, maxDim, box.min.y);

      const fov = camera.fov * Math.PI / 180;
      const dist = (maxDim / 2) / Math.tan(fov / 2) * 1.4;
      cameraDist = dist;

      const dirV = new THREE.Vector3(0.6, 0.45, 0.7).normalize();
      camera.position.copy(center).addScaledVector(dirV, dist);

      camera.near = Math.max(0.001, maxDim * 0.01);
      camera.far = Math.max(10, maxDim * 30);
      camera.updateProjectionMatrix();

      modelBox = box;
      needsRender = true;

      controls.target.copy(center);
      controls.minDistance = maxDim * 0.05;
      controls.maxDistance = maxDim * 5;
      controls.update();

      placeLights(center, maxDim);
    }

    function addGround(center, maxDim, minY) {
      if (groundPlane) {
        scene.remove(groundPlane);
        groundPlane.geometry.dispose();
        groundPlane.material.dispose();
        groundPlane = null;
      }
      const groundSize = maxDim * 3;
      const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x8899aa,
        roughness: 1,
        metalness: 0,
      });
      groundPlane = new THREE.Mesh(groundGeo, groundMat);
      groundPlane.rotation.x = -Math.PI / 2;
      groundPlane.position.set(center.x, minY - 0.01, center.z);
      groundPlane.receiveShadow = true;
      scene.add(groundPlane);
    }

    const LIGHTAZ = { value: 153 };
    const YAXIS = new THREE.Vector3(0, 1, 0);

    function placeLights(center, maxDim) {
      const d = maxDim * 0.9;
      const ang = (LIGHTAZ.value * Math.PI) / 180;

      shadowRig.forEach(l => {
        l.userData.dir.copy(l.userData.baseDir).applyAxisAngle(YAXIS, ang);
        l.position.copy(center).addScaledVector(l.userData.dir, maxDim * 2);
        l.target.position.copy(center);

        l.shadow.mapSize.set(2048, 2048);
        l.shadow.camera.left = -d;
        l.shadow.camera.right = d;
        l.shadow.camera.top = d;
        l.shadow.camera.bottom = -d;
        l.shadow.camera.near = maxDim * 0.01;
        l.shadow.camera.far = maxDim * 6;
        l.shadow.camera.updateProjectionMatrix();

        l.shadow.bias = -0.0002;
        l.shadow.normalBias = maxDim * 0.0002;
      });
    }

    // ---------- UI Controls ----------
    const lightAz = document.getElementById('light-az');
    const lightAzVal = document.getElementById('light-az-val');
    lightAz.addEventListener('input', () => {
      LIGHTAZ.value = parseInt(lightAz.value, 10);
      lightAzVal.textContent = `${LIGHTAZ.value}°`;
      if (modelRoot) placeLights(modelCenter, modelMaxDim);
      needsRender = true;
    });

    const aoToggle = document.getElementById('ao-toggle');
    aoToggle.addEventListener('change', () => {
      n8ao.enabled = aoToggle.checked;
      document.querySelector('.online').textContent = aoToggle.checked ? 'N8AO включён' : 'N8AO выключен';
      needsRender = true;
    });

    // ---------- List Toggle ----------
    const listToggle = document.getElementById('list-toggle');
    const listChevron = document.getElementById('list-chevron');
    const listContainer = document.getElementById('list');

    listToggle.addEventListener('click', () => {
      listContainer.classList.toggle('collapsed');
      listChevron.textContent = listContainer.classList.contains('collapsed') ? '▶' : '▼';
    });

    // ---------- Resize ----------
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      needsRender = true;
    });

    // ---------- Render Loop ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      if (needsRender) {
        composer.render();
        needsRender = false;
      }
    }
    animate();

    // ---------- Model Load ----------
    (async () => {
      try {
        const loader = new GLTFLoader();
        const url = 'model.glb'; // замените на свой путь
        const gltf = await loader.loadAsync(url);
        modelRoot = collectParts(gltf.scene);
        scene.add(modelRoot);
        buildList();
        updateCount();
        fitCamera();
        overlay.classList.add('gone');
      } catch (e) {
        loadMsg.style.display = 'none';
        loadErr.style.display = 'block';
        loadErr.textContent = 'Ошибка загрузки модели: ' + (e.message || e);
      }
    })();
  </script>
</body>
</html>
