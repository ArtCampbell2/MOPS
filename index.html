<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест 3D модели</title>
    <style>
        /* Растягиваем страницу и плеер на весь экран, фон темно-серый */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        model-viewer { width: 100%; height: 100%; display: block; outline: none; }
    </style>
    
    <!-- Подключаем скрипт плеера от Google -->
    <script type="module" src="https://googleapis.com"></script>
</head>
<body>

    <!-- Загружаем модель mops.glb напрямую из вашего репозитория -->
    <model-viewer src="./mops.glb" camera-controls shadow-intensity="1" environment-image="neutral" exposure="1">
    </model-viewer>

</body>
</html>
